<!DOCTYPE html>
<html lang="en">

<head>
    <title>Search - Advanced</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="nav-main">
        <ul>
            <li><a href="index.html">Search Text</a></li>
            <li><a href="g_image.html">Search Image</a></li>
            <li class="active"><a href="g_advanced.html">Advanced</a></li>
        </ul>
    </nav>
    <h1>Advanced Search</h1>
    <form action="https://google.com/search">
        Find pages with:<br><br>

        <div class="field-row">
            <label for="as_q"> all these words:</label>
            <input type="text" id="as_q" name="as_q">
            <span>(as_q - all words query)</span>
        </div>

        <div class="field-row">
            <label for="as_epq"> this exact word or phrase:</label>
            <input type="text" id="as_epq" name="as_epq">
            <span>(as_epq - exact phrase query)</span>
        </div>

        <div class="field-row">
            <label for="as_oq"> any of these words:</label>
            <input type="text" id="as_oq" name="as_oq">
            <span>(as_oq - optional query)</span>
        </div>

        <div class="field-row">
            <label for="as_eq"> none of these words:</label>
            <input type="text" id="as_eq" name="as_eq">
            <span>(as_eq - exclude query)</span>
        </div>

        <input type="submit" value="Google Advanced Search">
    </form>
</body>

</html>
